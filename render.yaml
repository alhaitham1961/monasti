services:
  - type: web
    name: monasti
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: monasti-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://monati.onrender.com

databases:
  - name: monasti-db
    plan: free
    databaseName: monasti
    user: monati
